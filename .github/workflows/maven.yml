# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "singlestore-*" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Get project version from pom.xml
      id: get-version # Assign an ID to the step to reference its outputs
      run: echo "PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
      shell: bash

    - name: Build with Maven
      run: mvn -B --file pom.xml clean package -P release -am -pl 'debezium-connector-mysql,debezium-connector-mongodb,debezium-connector-postgres,debezium-connector-sqlserver'

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debezium-artifacts-${{ github.sha }}
        path: |
          ./*/target/debezium*${{ env.PROJECT_VERSION }}.jar
